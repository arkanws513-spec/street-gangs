<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عصابات الشوارع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111316;
    --bg-body:#0c0d0f;
    --surface:#1a1d22;
    --surface-2:#20242a;
    --border:#2c3137;
    --text:#ece8e1;
    --text-dim:#9aa0a8;
    --text-faint:#666c73;
    --accent:#d9a441;
    --accent-strong:#f0c163;
    --danger:#c1443c;
    --good:#4fa8a0;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font: 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]){
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html{
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg-body);
    color:var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  button{ font-family:inherit; }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100%;
    background:var(--bg);
    position:relative;
    overflow-x:hidden;
  }
  @media (min-width:540px){
    body{ background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(217,164,65,.06), transparent 60%),
      var(--bg-body);
    }
    .app{
      margin-top:28px;
      margin-bottom:28px;
      border-radius:28px;
      border:1px solid var(--border);
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      min-height:auto;
    }
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:38px; height:38px;
    border:1.5px solid var(--accent);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-size:19px;
    font-weight:800;
    flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-text strong{ font-size:15px; font-weight:800; letter-spacing:.2px; }
  .brand-text span{ font-size:11.5px; color:var(--text-dim); }
  .cash-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:999px;
  }
  .cash-pill .cash-icon{ font-size:14px; }
  .cash-pill b{ font-size:14.5px; font-weight:800; color:var(--accent-strong); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    display:flex; align-items:center; gap:16px;
    padding:22px 18px 18px;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 18% 30%, rgba(217,164,65,.16), transparent 55%);
    pointer-events:none;
  }
  .hero-badge{
    position:relative;
    width:64px; height:64px;
    border-radius:16px;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .hero-badge::after{
    content:"مستوى";
    position:absolute;
    bottom:-9px;
    font-size:9px;
    color:var(--text-dim);
    background:var(--bg);
    padding:0 6px;
  }
  .hero-badge b{ font-size:26px; font-weight:900; color:var(--accent-strong); }
  .hero-content{ position:relative; }
  .hero-content h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:900;
    letter-spacing:.2px;
  }
  .hero-content p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.6;
    max-width:30ch;
  }

  /* ---------- Meters ---------- */
  .meters{ padding:2px 18px 14px; display:flex; flex-direction:column; gap:10px; }
  .meter-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; color:var(--text-dim); margin-bottom:6px;
  }
  .meter-head span:first-child{ color:var(--text); font-weight:700; }
  .meter-track{
    height:8px; border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-strong));
    border-radius:999px;
    transition:width .4s ease;
  }
  .meter-note{
    display:block; margin-top:5px;
    font-size:10.5px; color:var(--text-faint);
  }
  .pill-row{ display:flex; gap:10px; }
  .pill-stat{
    flex:1;
    display:flex; align-items:center; gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .pill-stat span{ font-size:16px; }
  .pill-stat b{ font-size:15px; font-weight:800; }
  .pill-stat small{ display:block; font-size:10.5px; color:var(--text-dim); }

  /* ---------- Menu grid ---------- */
  main{ padding:6px 18px 26px; }
  main h2{
    font-size:13px; font-weight:700; color:var(--text-dim);
    margin:14px 2px 10px;
  }
  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    text-align:right;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .tile:active{ transform:scale(.97); }
  .tile:hover{ border-color:#3a4048; }
  .tile .tile-icon{ font-size:22px; }
  .tile b{ font-size:13.5px; font-weight:800; }
  .tile small{ font-size:10.5px; color:var(--text-dim); line-height:1.5; }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(6,7,8,.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px;
    max-height:82vh;
    background:var(--bg);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,.9,.32,1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .sheet, .sheet-overlay{ transition:none; }
  }
  .sheet-handle{
    width:36px; height:4px; border-radius:999px;
    background:var(--border);
    margin:10px auto 0;
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px;
    flex-shrink:0;
  }
  .sheet-header h2{ margin:0; font-size:17px; font-weight:800; }
  .sheet-header button{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .sheet-content{
    overflow-y:auto;
    padding:4px 18px 22px;
  }
  .sheet-sub{
    font-size:12px; color:var(--text-dim); line-height:1.6;
    margin:0 0 14px;
  }

  /* ---------- Reusable rows ---------- */
  .row-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 12px;
    margin-bottom:9px;
  }
  .row-icon{
    width:38px; height:38px; flex-shrink:0;
    border-radius:10px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .row-info{ flex:1; min-width:0; }
  .row-info b{ display:block; font-size:13px; font-weight:800; }
  .row-info small{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .row-actions{ display:flex; gap:6px; }

  .btn{
    border:none; cursor:pointer;
    background:var(--accent);
    color:#1a1204;
    font-weight:800; font-size:12.5px;
    padding:9px 14px;
    border-radius:var(--radius-sm);
    white-space:nowrap;
    transition:filter .15s ease, transform .15s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn:hover{ filter:brightness(1.08); }
  .btn-small{ padding:7px 11px; font-size:11.5px; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-block{ display:block; width:100%; text-align:center; margin-top:6px; }
  .btn-danger{ background:var(--danger); color:#fff; }

  .progress-line{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 13px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .progress-line b{ color:var(--text); font-size:14px; }

  .chip-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:11.5px; font-weight:700;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1204;
  }

  .skill-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    margin-bottom:9px;
  }
  .skill-row b{ display:block; font-size:13px; font-weight:800; }
  .skill-row small{ font-size:10.5px; color:var(--text-dim); }

  .result-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    margin-bottom:14px;
  }
  .result-icon{
    width:40px; height:40px; flex-shrink:0;
    border-radius:50%;
    background:rgba(79,168,160,.15);
    color:var(--good);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800;
  }
  .result-card b{ display:block; font-size:14px; }
  .result-card small{ font-size:11px; color:var(--text-dim); }
  .reward-list{ list-style:none; margin:0 0 4px; padding:0; }
  .reward-list li{
    font-size:13px; padding:6px 0;
    border-bottom:1px dashed var(--border);
  }
  .reward-list li:last-child{ border-bottom:none; }
  .reward-list .level-up{ color:var(--accent-strong); font-weight:800; }

  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:9px;
    margin-bottom:16px;
  }
  .stat-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px;
  }
  .stat-box b{ display:block; font-size:12.5px; margin-bottom:3px; }
  .stat-box span{ font-size:18px; font-weight:900; color:var(--accent-strong); }

  .notice{
    font-size:12px; padding:10px 12px;
    border-radius:var(--radius-sm);
    margin-bottom:12px;
  }
  .notice-warn{ background:rgba(193,68,60,.12); color:#e8827b; border:1px solid rgba(193,68,60,.3); }

  /* ---------- Battle screen ---------- */
  .battle-wrap{ padding-bottom:4px; }
  .battle-scene{
    position:relative;
    min-height:238px;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin:4px 0 12px;
    background:
      radial-gradient(circle at 50% 28%, rgba(217,164,65,.10), transparent 34%),
      linear-gradient(180deg, #171a1f 0%, #111316 58%, #0d0f11 100%);
  }
  .battle-scene::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:27px;
    height:48px;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  }
  .battle-arena{
    position:relative;
    min-height:238px;
    display:grid;
    grid-template-columns:1fr 54px 1fr;
    align-items:center;
    gap:6px;
    padding:18px 8px 28px;
  }
  .fighter{
    position:relative;
    z-index:2;
    background:rgba(26,29,34,.88);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px 7px;
    text-align:center;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .fighter.active{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(217,164,65,.12);
    transform:translateY(-3px);
  }
  .fighter.hit-player{ animation:battleAttackPlayer .34s ease; }
  .fighter.hit-enemy{ animation:battleAttackEnemy .34s ease; }
  .fighter.damage{ animation:battleDamage .3s ease; }
  @keyframes battleAttackPlayer{
    0%,100%{ transform:translateX(0); }
    45%{ transform:translateX(14px) scale(1.035); }
  }
  @keyframes battleAttackEnemy{
    0%,100%{ transform:translateX(0); }
    45%{ transform:translateX(-14px) scale(1.035); }
  }
  @keyframes battleDamage{
    0%,100%{ filter:none; }
    35%{ transform:translateX(5px); filter:brightness(1.55); }
  }
  .avatar{
    width:76px;
    height:76px;
    margin:0 auto 8px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(145deg,var(--surface-2),var(--surface));
    border:1px solid var(--border);
  }
  .player-avatar{ position:relative; overflow:visible; }
  .battle-gear{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
    z-index:3;
  }
  .battle-vest{
    right:-5px;
    bottom:3px;
    font-size:23px;
    transform:rotate(7deg);
  }
  .battle-weapon{
    left:-8px;
    top:7px;
    font-size:25px;
    transform:rotate(-18deg);
  }
  .fighter-name{ font-size:12px; font-weight:800; margin-bottom:3px; }
  .fighter-power{ font-size:10.5px; color:var(--text-dim); }
  .hp-track{
    height:7px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
    margin-top:8px;
  }
  .hp-fill{
    height:100%;
    width:100%;
    background:var(--good);
    border-radius:999px;
    transition:width .3s ease;
  }
  .battle-ground{
    position:absolute;
    left:50%;
    bottom:18px;
    width:72%;
    height:2px;
    transform:translateX(-50%);
    background:var(--border);
    box-shadow:0 0 18px rgba(217,164,65,.08);
  }
  .impact{
    position:absolute;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent-strong);
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
    z-index:4;
    pointer-events:none;
  }
  .impact.show{ animation:impactFlash .32s ease; }
  @keyframes impactFlash{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.2); }
    35%{ opacity:1; transform:translate(-50%,-50%) scale(2.8); box-shadow:0 0 24px rgba(240,193,99,.55); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(4.5); }
  }
  .vs{
    position:relative;
    z-index:3;
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
    color:var(--accent-strong);
  }
  .battle-status{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    min-height:22px;
    margin-bottom:9px;
  }
  .battle-log{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:10px 12px;
    max-height:120px;
    overflow:auto;
    margin-bottom:10px;
  }
  .battle-log p{
    margin:0;
    padding:5px 0;
    border-bottom:1px dashed var(--border);
    font-size:11.5px;
    line-height:1.45;
  }
  .battle-log p:last-child{ border-bottom:none; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translate(-50%, 12px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-size:12.5px; font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:80;
    max-width:88%;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast-warn{ border-color:rgba(193,68,60,.5); }
  .toast-good{ border-color:rgba(79,168,160,.5); }

  .visual-concept{
    margin:0 18px 16px;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    background:var(--surface);
    box-shadow:0 12px 30px rgba(0,0,0,.28);
  }
  .visual-concept img{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
  }
  .visual-caption{
    padding:9px 12px;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
  }

\n  .locked{opacity:.55}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}.timer{font-size:24px;font-weight:900;color:var(--accent-strong);padding:12px 0}.airportHero,.cityHero{border:1px solid var(--border);border-radius:18px;min-height:150px;padding:18px;position:relative;overflow:hidden;background:linear-gradient(160deg,#1c2831,#101317);margin-bottom:12px}.airportHero{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:5px}.airportHero small{font-size:11px}.cityHero h2{margin:0;font-size:25px}.cityHero p{margin:5px 0;color:var(--text-dim)}.pyramid{position:absolute;bottom:0;right:20%;width:0;height:0;border-left:58px solid transparent;border-right:58px solid transparent;border-bottom:95px solid #b89055}.pyramid.small{right:48%;border-left-width:38px;border-right-width:38px;border-bottom-width:65px}.sphinx{position:absolute;left:12%;bottom:10px;font-size:48px}.citySilhouette{font-size:72px;text-align:center;margin-top:20px}.places{display:grid;gap:9px}.place{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;color:var(--text);text-align:right}.placeArt{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:25px}.placeBody b,.placeBody small{display:block}.placeBody small{font-size:10px;color:var(--text-dim)}.cabin{background:linear-gradient(180deg,#26303a,#15181c);border:1px solid var(--border);border-radius:18px;padding:12px}.cabinTop{text-align:center;font-weight:800;margin-bottom:10px}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 2px;text-align:center;font-size:19px}.seat small{display:block;font-size:8px;color:var(--text-dim)}.flightProgress{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}.flightProgress i{display:block;height:100%;background:var(--accent)}.mission-image-wrap{margin-bottom:10px;border:1px solid var(--border);border-radius:16px;overflow:hidden}.missionBattleImage{display:block;width:100%;height:auto;max-height:none;object-fit:contain}\n</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">♠</div>
      <div class="brand-text">
        <strong>عصابات الشوارع</strong>
        <span>زعيم المدينة</span>
      </div>
    </div>
    <div class="cash-pill"><span class="cash-icon">💵</span><b id="cash">0</b></div>
  </header>

  <section class="hero">
    <div class="hero-badge"><b id="levelBadge">1</b></div>
    <div class="hero-content">

<script>
(()=>{const C=[['main','المدينة الرئيسية',0,0],['cairo','القاهرة',1300,14],['alex','الإسكندرية',1700,18],['dubai','دبي',3500,45],['istanbul','إسطنبول',5200,70]],K='street_gangs_v5',Q=x=>document.getElementById(x),N=l=>40+(l-1)*20,B=l=>7*2**(l-1),E=l=>8*2**(l-1);let s=JSON.parse(localStorage.getItem(K)||'null')||{cash:12000,level:1,xp:0,energy:20,max:20,last:Date.now(),free:0,city:'main',done:0,stats:{power:0,defense:0,speed:0,accuracy:0},travel:null,hospital:null,gear:{shield:0,boots:0,helmet:0,kit:0}};const city=()=>C.find(x=>x[0]===s.city)||C[0],save=()=>localStorage.setItem(K,JSON.stringify(s)),toast=m=>{let e=Q('toast')||Object.assign(document.body.appendChild(document.createElement('div')),{id:'toast'});e.textContent=m;e.style='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111a24;color:white;padding:10px 15px;border:1px solid #3d5066;border-radius:99px;z-index:999;font:12px Tahoma'};function open(t,h){let o=Q('screen')||document.querySelector('.sheet-overlay'),a=Q('sheetTitle'),c=Q('content');if(o)o.classList.add('open');if(a)a.textContent=t;if(c)c.innerHTML=h}
function missions(){let h='<p class="sheet-sub">50 مستوى. قوة الخصم في المستوى 1 = 8 وتتضاعف ×2، والقوة الأساسية للمستخدم في المستوى 1 = 7 وتتضاعف ×2.</p><div class="progress-line"><span>المهمات المكتملة</span><b>'+s.done+' / 50</b></div>';for(let l=1;l<=50;l++){let z=s.level<l;h+='<div class="row-card '+(z?'locked':'')+'"><div class="row-icon">⚔️</div><div class="row-info"><b>مهمة المستوى '+l+'</b><small>قوة الخصم: '+E(l).toLocaleString()+' • النوع: قتال • الصعوبة: '+l+' • ⚡ 1</small></div><button class="btn btn-small" data-m="'+l+'" '+(z?'disabled':'')+'>'+(z?'مغلق':'ابدأ')+'</button></div>'}open('المهمات',h)}
function training(){let h='<div class="notice">النقاط الحرة: <b>'+s.free+'</b><br>كل رفع مستوى يمنح 10 نقاط، والتدريب لا يستهلك الطاقة.</div>';[['power','💪','القوة'],['defense','🛡️','الدفاع'],['speed','⚡','السرعة'],['accuracy','🎯','الدقة']].forEach(x=>h+='<div class="skill-row"><div><b>'+x[1]+' '+x[2]+'</b><small> '+s.stats[x[0]]+'</small></div><button class="btn btn-small" data-t="'+x[0]+'" '+(!s.free?'disabled':'')+'>+1</button></div>');open('التدريب',h)}
function market(){let h='<div class="notice">شراء الطاقة بالكامل: 2000 💵. معدات الحماية تختلف حسب المدينة.</div>';let a=s.city==='cairo'?[['shield','🛡️','درع القاهرة',2800],['boots','🥾','حذاء الرمال',2100],['helmet','🪖','خوذة الحارس',2400],['kit','🔫','سلاح تكتيكي',3000]]:[['shield','🛡️','درع تكتيكي',1800],['boots','🥾','حذاء مطارد',1100],['helmet','🪖','خوذة حماية',1400],['kit','🔫','سلاح المدينة',900]];a.forEach(x=>h+='<div class="row-card"><div class="row-icon">'+x[1]+'</div><div class="row-info"><b>'+x[2]+'</b><small>💵 '+x[3]+' • معك: '+(s.gear[x[0]]||0)+'</small></div><button class="btn btn-small" data-buy="'+x[0]+'" data-price="'+x[3]+'">شراء</button></div>');if(s.city==='main')h+='<button class="btn btn-block" data-energy>شراء الطاقة • 2000</button>';if(s.city==='cairo'){let sold=[['shield','🛡️','درع تكتيكي',1800],['boots','🥾','حذاء مطارد',1100],['helmet','🪖','خوذة حماية',1400],['kit','🔫','سلاح المدينة',900]];h+='<div class="card"><b>💰 إعادة بيع مشتريات المدينة الرئيسية</b>';sold.forEach(x=>{let q=s.gear[x[0]]||0;if(q)h+='<div class="row" style="margin-top:8px"><span>'+x[1]+'</span><div class="grow"><b>'+x[2]+'</b><small style="display:block;color:var(--m)">معك: '+q+'</small></div><button class="btn btn-small" data-sell="'+x[0]+'">بيع</button></div>'});h+='</div>'}open('مركز التسوق',h)}
function airport(){let h='<div class="airportHero"></div><p class="sheet-sub">5 مدن في النظام الحالي. الرحلة إلى القاهرة: 1300 و14 دقيقة.</p>';C.slice(1).forEach(c=>h+='<div class="row-card"><div class="row-icon">✈️</div><div class="row-info"><b>المدينة الرئيسية → '+c[1]+'</b><small>💵 '+c[2].toLocaleString()+' • ⏱️ '+c[3]+' دقيقة</small></div><button class="btn btn-small" data-f="'+c[0]+'">حجز</button></div>');open('المطار',h)}
function cabin(c){let h='<div class="cabin"><div class="seats">';for(let i=0;i<16;i++)h+='<div class="seat">👤<small>مقعد '+(i+1)+'</small></div>';h+='</div></div><div class="card"><b>✈️ الرحلة إلى '+c[1]+'</b><small style="display:block;color:var(--muted)">الوصول بعد '+Math.max(1,Math.ceil((s.travel.a-Date.now())/60000))+' دقيقة</small><div class="flightProgress"><i style="width:'+Math.max(0,100-(s.travel.a-Date.now())/(c[3]*60000)*100)+'%"></i></div></div>';open('الطائرة من الداخل',h)}
function cityView(){let h=s.city==='cairo'?'<div class="cityHero"><h2>القاهرة</h2><p>الأهرامات وأبو الهول</p><div class="pyramid"></div><div class="pyramid small"></div><div class="sphinx">🗿</div></div>':'<div class="cityHero" style="background:linear-gradient(#294d67,#111a23)"><h2>المدينة الرئيسية</h2><p>مركز انطلاق العصابة</p><div class="sphinx">🏙️</div></div>';let a=[['🏢','المركز الرئيسي',''],['⚔️','حلبة القتال','data-vopen=missions'],['🛒','مركز التسوق','data-vopen=market'],['🔒','السجن',''],['🏥','المستشفى','data-vopen=hospital']];if(s.city==='main')a=a.slice(0,3).concat([['✈️','المطار','data-vopen=airport']]);h+='<div class="places">'+a.map(x=>'<button class="place" '+x[2]+'><div class="placeArt">'+x[0]+'</div><div class="placeBody"><b>'+x[1]+'</b><small>'+({'🏢':'إدارة ومتابعة العصابة','⚔️':'المهمات والمواجهات','🛒':'معدات وأسعار المدن','🔒':'الأحداث الخاصة بالسجن','🏥':'راحة بعد الخسارة','✈️':'السفر بين المدن'}[x[0]]||'')+'</small></div></button>').join('')+'</div>';open('مدينة '+city()[1],h)}
function hospital(){if(s.city!=='cairo')return open('المستشفى','<div class="notice">المستشفى متاح في القاهرة فقط.</div>');if(!s.hospital)return open('المستشفى','<div class="notice">لا تحتاج إلى راحة الآن. بعد خسارة حلبة القتال قد تحتاج 3 إلى 5 دقائق حسب حالتك.</div>');let r=Math.max(0,s.hospital-Date.now());if(!r){s.hospital=null;save();return hospital()}open('المستشفى','<div class="card"><h3>🏥 الراحة</h3><div class="timer">المتبقي: '+Math.ceil(r/60000)+' دقيقة</div><p class="sub">يمكنك الانتظار حتى انتهاء فترة الراحة ثم العودة إلى الحلبة.</p></div>')}

/* ===== شاشة القتال التفاعلية ===== */
function battle(l){
  if(s.energy<1)return toast('لا توجد طاقة كافية');
  s.energy--;s.last=Date.now();save();

  const ep=E(l),eDef=Math.round(ep*.55),eSpd=Math.round(ep*.4),eAcc=Math.round(ep*.35);
  const pp=B(s.level)+s.stats.power,pDef=10+s.stats.defense,pSpd=s.stats.speed,pAcc=8+s.stats.accuracy;
  let ph=100,eh=100,stamina=100,guardPlayer=false,auto=false,over=false;

  const slots=['kit','shield','boots','helmet'];
  const slotIcon={kit:'🔫',shield:'🛡️',boots:'🥾',helmet:'🪖'};
  const slotLabel={kit:'السلاح',shield:'الدرع',boots:'الحذاء',helmet:'الخوذة'};

  function gearRow(owned){
    return '<div class="battleGear">'+slots.map(k=>
      '<div class="gearSlot'+(owned&&!s.gear[k]?' empty':'')+'"><span>'+slotIcon[k]+'</span><small>'+slotLabel[k]+'</small></div>'
    ).join('')+'</div>';
  }

  function panel(isEnemy){
    const name=isEnemy?'الخصم':'المستخدم',lvl=isEnemy?l:s.level,hp=isEnemy?eh:ph;
    const st=isEnemy?{power:ep,defense:eDef,speed:eSpd,accuracy:eAcc}:{power:Math.round(pp),defense:pDef,speed:pSpd,accuracy:pAcc};
    return '<div class="side'+(isEnemy?' enemy':'')+'">'
      +'<div class="portrait">'+(isEnemy?'🥷':'👤')+'</div>'
      +'<b>'+name+'</b><small>المستوى '+lvl+'</small>'
      +'<div class="hp"><i id="'+(isEnemy?'ehp':'php')+'" style="width:'+hp+'%"></i></div>'
      +'<div class="statsMini">'
        +'<span>💪 القوة: '+st.power+'</span>'
        +'<span>🛡️ الدفاع: '+st.defense+'</span>'
        +'<span>⚡ السرعة: '+st.speed+'</span>'
        +'<span>🎯 الدقة: '+st.accuracy+'</span>'
      +'</div>'
      +gearRow(!isEnemy)
      +'</div>';
  }

  function render(){
    open('مهمة قتال • مستوى المهمة: '+l,
      '<div class="battle">'
        +'<div class="battleHead">'+panel(false)+'<div class="vs">VS</div>'+panel(true)+'</div>'
        +'<div class="turn" id="bt">دورك الآن</div>'
        +'<div class="log" id="bl"></div>'
        +'<div class="battleActions">'
          +'<button class="btn" id="atk">⚔️ هجوم</button>'
          +'<button class="btn" id="def">🛡️ دفاع</button>'
        +'</div>'
        +'<div class="staminaRow"><span>⚡ نقاط التحمل</span><b id="stv">'+stamina+' / 100</b></div>'
        +'<div class="hp"><i id="stf" style="width:'+stamina+'%"></i></div>'
        +'<button class="btn btn-block" id="autoBtn">الهجوم التلقائي</button>'
        +'<div class="battleFooter">'
          +'<button class="btn btn-ghost" id="retreat">🏃 الانسحاب</button>'
          +'<button class="btn btn-ghost" id="exit">🚪 خروج</button>'
        +'</div>'
      +'</div>');
    bind();
  }

  function log(msg){let el=Q('bl');if(!el)return;let p=document.createElement('p');p.innerHTML=msg;el.prepend(p)}

  function updateBars(){
    if(Q('php'))Q('php').style.width=Math.max(0,ph)+'%';
    if(Q('ehp'))Q('ehp').style.width=Math.max(0,eh)+'%';
    if(Q('stv'))Q('stv').textContent=Math.max(0,stamina)+' / 100';
    if(Q('stf'))Q('stf').style.width=Math.max(0,stamina)+'%';
  }

  function end(win){
    over=true;
    if(win){
      let xp=N(l),money=900+l*350;
      s.cash+=money;s.done=Math.min(50,s.done+1);s.xp+=xp;
      let up=0;
      while(s.xp>=N(s.level)&&s.level<50){s.xp-=N(s.level);s.level++;s.free+=10;s.energy=s.max;up++}
      save();
      open('نتيجة المعركة','<div class="result-card"><b>🏆 فزت بالمهمة</b><p>💵 +'+money+' • ✨ XP +'+xp+'</p>'+(up?'<p>🎉 ارتقيت إلى المستوى '+s.level+' وحصلت على 10 نقاط حرة.</p>':'')+'</div>');
    }else{
      s.hospital=s.city==='cairo'?Date.now()+(ph<35?300000:ph<70?240000:180000):null;
      save();
      open('نتيجة المعركة','<div class="result-card"><b>❌ خسرت</b><p>لم تحصل على مكافأة. إذا كنت في القاهرة ستجد فترة الراحة في المستشفى: 3–5 دقائق حسب الحالة.</p></div>');
    }
  }

  function playerTurn(action){
    if(over)return;
    const cost=action==='atk'?15:8;
    if(stamina<cost)return toast('نقاط التحمل غير كافية');
    stamina=Math.max(0,stamina-cost);
    guardPlayer=action==='def';
    if(action==='atk'){
      let dmg=Math.max(1,Math.round(pp*(.7+Math.random()*.3)-eDef*.3));
      eh=Math.max(0,eh-dmg);
      log('⚔️ لقد هاجمت الخصم وسببت '+dmg+' نقطة ضرر.');
    }else{
      log('🛡️ اتخذت وضع الدفاع، سيقل الضرر القادم.');
    }
    updateBars();
    if(eh<=0)return end(true);
    if(stamina<=0){
      log('😮‍💨 نفدت نقاط تحملك.');
      return end(false);
    }
    if(Q('bt'))Q('bt').textContent='دور الخصم';
    setTimeout(enemyTurn,600);
  }

  function enemyTurn(){
    if(over)return;
    if(Math.random()<.18){
      log('🛡️ الخصم اتخذ وضع الدفاع.');
    }else{
      let dmg=Math.max(1,Math.round(ep*(.5+Math.random()*.25)-pDef*(.3+(guardPlayer?.35:0))));
      ph=Math.max(0,ph-dmg);
      log('👊 هاجمك الخصم وسبب لك '+dmg+' نقطة ضرر.');
    }
    guardPlayer=false;
    updateBars();
    if(ph<=0)return end(false);
    if(Q('bt'))Q('bt').textContent='دورك الآن';
    if(auto&&!over&&stamina>=15)setTimeout(()=>playerTurn('atk'),500);
  }

  function bind(){
    let a=Q('atk'),d=Q('def'),ab=Q('autoBtn'),r=Q('retreat'),ex=Q('exit');
    if(a)a.onclick=()=>playerTurn('atk');
    if(d)d.onclick=()=>playerTurn('def');
    if(ab)ab.onclick=()=>{
      auto=!auto;
      ab.textContent=auto?'إيقاف الهجوم التلقائي':'الهجوم التلقائي';
      if(auto&&!over)playerTurn('atk');
    };
    if(r)r.onclick=()=>{if(!over)end(false)};
    if(ex)ex.onclick=()=>{let o=Q('screen')||document.querySelector('.sheet-overlay');if(o)o.classList.remove('open')};
  }

  render();
}

window.SG2={missions,training,market,airport,cabin,cityView,hospital,battle,save,state:s,city};})();

</script>
<script>
(()=>{'use strict';const G=window.SG2;if(!G)return;const S=G.state,$=id=>document.getElementById(id),O=$('screen'),T=$('sheetTitle'),C=$('content'),IMG='assets/mission-battle.b64';let regenId,travelId;
const money=n=>Number(n||0).toLocaleString('ar-EG'),name=id=>({main:'المدينة الرئيسية',cairo:'القاهرة',alex:'الإسكندرية',dubai:'دبي',istanbul:'إسطنبول'})[id]||id;

function missions(){let h='<p class="sheet-sub">50 مستوى. الخصم: 8×2^(المستوى-1)، وقوتك الأساسية: 7×2^(مستواك-1). المهمة تستهلك ⚡1.</p><div class="progress-line"><span>المهمات المكتملة</span><b>'+S.done+' / 50</b></div>';for(let l=1;l<=50;l++){const lock=l>S.level;h+='<div class="row-card '+(lock?'locked':'')+'"><div class="row-icon">⚔️</div><div class="row-info"><b>مهمة المستوى '+l+'</b><small>قوة الخصم: '+(8*2**(l-1)).toLocaleString()+' • النوع: قتال • الصعوبة: '+l+'</small></div><button class="btn btn-small" data-m="'+l+'" '+(lock?'disabled':'')+'>'+(lock?'مغلق':'ابدأ')+'</button></div>'}open('المهمات',h)}
function training(){let h='<div class="notice">النقاط الحرة: <b>'+S.free+'</b>. التدريب لا يستهلك الطاقة.</div>';for(const x of [['power','💪','القوة'],['defense','🛡️','الدفاع'],['speed','⚡','السرعة'],['accuracy','🎯','الدقة']])h+='<div class="skill-row"><div><b>'+x[1]+' '+x[2]+'</b><small> '+S.stats[x[0]]+'</small></div><button class="btn btn-small" data-t="'+x[0]+'" '+(!S.free?'disabled':'')+'>+1</button></div>';open('التدريب',h)}
function market(){const ca=S.city==='cairo',a=ca?[['shield','🛡️','درع القاهرة',2800],['boots','🥾','حذاء الرمال',2100],['helmet','🪖','خوذة الحارس',2400],['kit','🔫','سلاح تكتيكي',3000]]:[['shield','🛡️','درع تكتيكي',1800],['boots','🥾','حذاء مطارد',1100],['helmet','🪖','خوذة حماية',1400],['kit','🔫','سلاح المدينة',900]];let h='<div class="notice">المعدات تختلف حسب المدينة. الطاقة والدواء من المدينة الرئيسية.</div>';a.forEach(x=>h+='<div class="row-card"><div class="row-icon">'+x[1]+'</div><div class="row-info"><b>'+x[2]+'</b><small>'+money(x[3])+' 💵 • معك '+(S.gear[x[0]]||0)+'</small></div><button class="btn btn-small" data-buy="'+x[0]+'" data-p="'+x[3]+'">شراء</button></div>');if(!ca)h+='<div class="row-card"><div class="row-icon">⚡</div><div class="row-info"><b>تعبئة الطاقة</b><small>2000 💵</small></div><button class="btn btn-small" data-energy>شراء</button></div><div class="row-card"><div class="row-icon">💊</div><div class="row-info"><b>دواء</b><small>800 💵 • معك '+(S.medicine||0)+'</small></div><button class="btn btn-small" data-medbuy>شراء</button></div>';if(ca){h+='<div class="notice">أدويتك: '+(S.medicine||0)+' 💊</div>';for(const x of [['shield','🛡️','درع تكتيكي',1800],['boots','🥾','حذاء مطارد',1100],['helmet','🪖','خوذة حماية',1400],['kit','🔫','سلاح المدينة',900]])if(S.gear[x[0]])h+='<div class="row-card"><div class="row-icon">'+x[1]+'</div><div class="row-info"><b>'+x[2]+'</b><small>سعر البيع '+money(Math.round(x[3]*1.05))+'</small></div><button class="btn btn-small" data-sell="'+x[0]+'">بيع</button></div>'}open('مركز التسوق',h)}
function airport(){let h='<div class="airportHero"><b>✈️ مطار المدينة</b><small>الرحلات بين المدن</small></div>';for(const c of [['cairo','القاهرة',1300,14],['alex','الإسكندرية',1700,18],['dubai','دبي',3500,45],['istanbul','إسطنبول',5200,70]])if(c[0]!==S.city)h+='<div class="row-card"><div class="row-icon">✈️</div><div class="row-info"><b>'+G.city()[1]+' → '+c[1]+'</b><small>'+money(c[2])+' 💵 • '+c[3]+' دقيقة</small></div><button class="btn btn-small" data-flight="'+c[0]+'">حجز</button></div>';open('المطار',h)}
function cabin(){let h='<div class="cabin"><div class="cabinTop">✈️ داخل الطائرة</div><div class="seats">';for(let i=1;i<=16;i++)h+='<div class="seat">👤<small>مقعد '+i+'</small></div>';h+='</div></div>';if(S.travel){const r=Math.max(0,S.travel.arrive-Date.now());h+='<div class="card"><b>متجه إلى '+name(S.travel.city)+'</b><small>الوصول بعد '+Math.ceil(r/60000)+' دقيقة</small><div class="flightProgress"><i style="width:'+Math.max(0,100-r/(S.travel.duration*60000)*100)+'%"></i></div></div>'}open('الطائرة من الداخل',h)}
function city(){const ca=S.city==='cairo';let h=ca?'<div class="cityHero cairoHero"><h2>القاهرة</h2><p>الأهرامات وأبو الهول</p><div class="pyramid"></div><div class="pyramid small"></div><div class="sphinx">🗿</div></div>':'<div class="cityHero mainHero"><h2>المدينة الرئيسية</h2><p>مركز العصابة</p><div class="citySilhouette">🏙️</div></div>';const p=ca?[['🏢','المركز الرئيسي',''],['⚔️','حلبة القتال','m'],['🛒','مركز التسوق','s'],['🔒','السجن','p'],['🏥','المستشفى','h']]:[['🏢','المركز الرئيسي',''],['⚔️','حلبة القتال','m'],['🛒','مركز التسوق','s'],['✈️','المطار','a']];h+='<div class="places">'+p.map(x=>'<button class="place" data-place="'+x[2]+'"><div class="placeArt">'+x[0]+'</div><div class="placeBody"><b>'+x[1]+'</b><small>اضغط للدخول</small></div></button>').join('')+'</div>';open('مدينة '+G.city()[1],h)}
function hospital(){if(S.city!=='cairo')return open('المستشفى','<div class="notice">المستشفى متاح في القاهرة فقط.</div>');const r=S.hospital?Math.max(0,S.hospital-Date.now()):0;if(!r)return open('المستشفى','<div class="notice">لا توجد فترة راحة حالياً.</div>');let h='<div class="card"><h3>🏥 الراحة</h3><div class="timer">'+Math.ceil(r/60000)+' دقيقة متبقية</div>';if(S.medicine>0)h+='<button class="btn btn-block" data-meduse>💊 استخدام دواء وتسريع التعافي</button>';open('المستشفى',h+'</div>')}
function trade(){open('التجارة','<div class="notice">نظام التجارة مرتبط بالمدينة الحالية. اشترِ معدات المدينة الرئيسية ثم بعها في القاهرة بسعر أعلى عندما تكون مناسبة.</div><div class="stat-grid"><div class="stat-box"><b>المدينة</b><span>'+G.city()[1]+'</span></div><div class="stat-box"><b>معداتك</b><span>'+Object.values(S.gear).reduce((a,b)=>a+b,0)+'</span></div></div><button class="btn btn-block" data-open-market>فتح السوق</button>')}function battle(l){G.battle(l);setTimeout(()=>{const host=C.querySelector('.battle');if(!host)return;const w=document.createElement('div');w.className='mission-image-wrap';w.innerHTML='<img class="missionBattleImage" alt="صورة القتال">';host.prepend(w);fetch(IMG).then(r=>r.text()).then(b=>{w.querySelector('img').src='data:image/jpeg;base64,'+b.trim()}).catch(()=>w.remove())},40)}
function flight(d){const v={cairo:[1300,14],alex:[1700,18],dubai:[3500,45],istanbul:[5200,70]}[d];if(!v)return;if(S.travel)return toast('لديك رحلة بالفعل');if(S.cash<v[0])return toast('الرصيد غير كافٍ');S.cash-=v[0];S.travel={city:d,from:S.city,arrive:Date.now()+v[1]*60000,duration:v[1]};G.save();sync();cabin();clearInterval(travelId);travelId=setInterval(check,10000)}
function check(){if(S.travel&&Date.now()>=S.travel.arrive){S.city=S.travel.city;S.travel=null;G.save();sync();clearInterval(travelId);toast('وصلت إلى '+G.city()[1],true);city()}}
function regen(){const n=Date.now(),g=Math.floor((n-(S.last||n))/180000);if(g>0){S.energy=Math.min(S.max,S.energy+g);S.last=n;G.save();sync()}}
function click(e){const b=e.target.closest('button');if(!b)return;if(b.id==='closeSheet'){close();return}const act=b.dataset.action;if(act){({ 'open-missions':missions,'open-training':training,'open-market':market,'open-airport':airport,'open-city':city,'open-trade':trade,'open-profile':()=>open('ملفي','<div class="stat-grid"><div class="stat-box"><b>المستوى</b><span>'+S.level+'</span></div><div class="stat-box"><b>الخبرة</b><span>'+S.xp+'</span></div><div class="stat-box"><b>المهمات</b><span>'+S.done+'</span></div></div>'),'open-base':()=>open('المقر','<div class="notice">المقر الحالي: '+G.city()[1]+'</div>')}[act]||(()=>{}))();return}if(b.dataset.m)return battle(+b.dataset.m);if(b.dataset.t){if(S.free){S.stats[b.dataset.t]++;S.free--;G.save();training()}return}if(b.dataset.buy){const p=+b.dataset.p;if(S.cash>=p){S.cash-=p;S.gear[b.dataset.buy]=(S.gear[b.dataset.buy]||0)+1;G.save();market()}else toast('الرصيد غير كافٍ');return}if(b.dataset.energy){if(S.city!=='main')return toast('الطاقة تُشترى من المدينة الرئيسية');if(S.cash>=2000){S.cash-=2000;S.energy=S.max;G.save();market()}else toast('الرصيد غير كافٍ');return}if(b.dataset.medbuy){if(S.cash>=800){S.cash-=800;S.medicine=(S.medicine||0)+1;G.save();market()}else toast('الرصيد غير كافٍ');return}if(b.dataset.meduse){if(S.medicine>0){S.medicine--;S.hospital=null;G.save();toast('تم استخدام الدواء',true);hospital()}else toast('لا يوجد دواء');return}if(b.dataset.sell){const k=b.dataset.sell,p={shield:1800,boots:1100,helmet:1400,kit:900};if(S.gear[k]){S.gear[k]--;S.cash+=Math.round(p[k]*1.05);G.save();market()}return}if(b.dataset.openMarket)return market();if(b.dataset.flight)return flight(b.dataset.flight);if(b.dataset.place)return ({m:missions,s:market,a:airport,h:hospital,p:()=>open('السجن','<div class="notice">السجن في القاهرة للأحداث القادمة.</div>')}[b.dataset.place]||(()=>{}))()}
function init(){S.medicine=S.medicine||0;regen();sync();document.addEventListener('click',click);$('closeSheet')?.addEventListener('click',close);O?.addEventListener('click',e=>{if(e.target===O)close()});regenId=setInterval(()=>{regen();check()},10000);check()}init()})();
</script>
</body>
</html>
