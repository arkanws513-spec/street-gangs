<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عصابات الشوارع</title><link rel="stylesheet" href="style.css"></head><body><div class="game">
<header><div class="avatar">♟</div><div><b>زعيم الشوارع</b><small>المستوى <strong id="level">1</strong></small></div><div class="res">💵 <b id="cash">1000</b>　⚡ <b id="energy">100</b>　🪙 <b id="respect">10</b></div><button id="reset">↻</button></header>
<section class="xp"><div><b>المستوى <span id="level2">1</span></b><span id="xpText">0 / 100 XP</span></div><i><em id="xpFill"></em></i><small>نقاط التحمل: <b id="stamina">0</b></small></section>
<main class="city"><div class="title"><small>الخريطة الرئيسية</small><h1>وسط المدينة</h1></div>
<div class="building one" data-a="missions"><div>📋</div><b>مركز المهمات</b><small>عقود ومعارك</small></div>
<div class="building two" data-a="training"><div>🏋️</div><b>مركز التدريب</b><small>قوة • دفاع • سرعة • دقة</small></div>
<div class="building three" data-a="market"><div>🏬</div><b>مركز التسوق</b><small>معدات وأدوات</small></div>
<div class="building four" data-a="trade"><div>📦</div><b>سوق التجارة</b><small>شراء وبيع بين المدن</small></div>
<div class="building five" data-a="base"><div>🏢</div><b>مقر العصابة</b><small>إدارة العصابة</small></div>
<div class="building six" data-a="profile"><div>👤</div><b>ملفي</b><small>الإحصاءات</small></div><div class="road"></div><div class="road r2"></div></main>
<section class="feed"><b>آخر الأحداث</b><div id="log"></div></section>
<nav><button data-a="home">⌂<small>المدينة</small></button><button data-a="missions">⚔<small>المهمات</small></button><button data-a="training">🏋<small>التدريب</small></button><button data-a="market">🛒<small>التسوق</small></button><button data-a="trade">📦<small>التجارة</small></button></nav></div>
<div id="screen"><div class="panel"><button id="close">×</button><div id="content"></div></div></div><script src="game.js"></script></body></html>
