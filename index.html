<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عصابات الشوارع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111316;
    --bg-body:#0c0d0f;
    --surface:#1a1d22;
    --surface-2:#20242a;
    --border:#2c3137;
    --text:#ece8e1;
    --text-dim:#9aa0a8;
    --text-faint:#666c73;
    --accent:#d9a441;
    --accent-strong:#f0c163;
    --danger:#c1443c;
    --good:#4fa8a0;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font: 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]){
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html{
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg-body);
    color:var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  button{ font-family:inherit; }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100%;
    background:var(--bg);
    position:relative;
    overflow-x:hidden;
  }
  @media (min-width:540px){
    body{ background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(217,164,65,.06), transparent 60%),
      var(--bg-body);
    }
    .app{
      margin-top:28px;
      margin-bottom:28px;
      border-radius:28px;
      border:1px solid var(--border);
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      min-height:auto;
    }
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:38px; height:38px;
    border:1.5px solid var(--accent);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-size:19px;
    font-weight:800;
    flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-text strong{ font-size:15px; font-weight:800; letter-spacing:.2px; }
  .brand-text span{ font-size:11.5px; color:var(--text-dim); }
  .cash-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:999px;
  }
  .cash-pill .cash-icon{ font-size:14px; }
  .cash-pill b{ font-size:14.5px; font-weight:800; color:var(--accent-strong); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    display:flex; align-items:center; gap:16px;
    padding:22px 18px 18px;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 18% 30%, rgba(217,164,65,.16), transparent 55%);
    pointer-events:none;
  }
  .hero-badge{
    position:relative;
    width:64px; height:64px;
    border-radius:16px;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .hero-badge::after{
    content:"مستوى";
    position:absolute;
    bottom:-9px;
    font-size:9px;
    color:var(--text-dim);
    background:var(--bg);
    padding:0 6px;
  }
  .hero-badge b{ font-size:26px; font-weight:900; color:var(--accent-strong); }
  .hero-content{ position:relative; }
  .hero-content h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:900;
    letter-spacing:.2px;
  }
  .hero-content p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.6;
    max-width:30ch;
  }

  /* ---------- Meters ---------- */
  .meters{ padding:2px 18px 14px; display:flex; flex-direction:column; gap:10px; }
  .meter-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; color:var(--text-dim); margin-bottom:6px;
  }
  .meter-head span:first-child{ color:var(--text); font-weight:700; }
  .meter-track{
    height:8px; border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-strong));
    border-radius:999px;
    transition:width .4s ease;
  }
  .meter-note{
    display:block; margin-top:5px;
    font-size:10.5px; color:var(--text-faint);
  }
  .pill-row{ display:flex; gap:10px; }
  .pill-stat{
    flex:1;
    display:flex; align-items:center; gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .pill-stat span{ font-size:16px; }
  .pill-stat b{ font-size:15px; font-weight:800; }
  .pill-stat small{ display:block; font-size:10.5px; color:var(--text-dim); }

  /* ---------- Menu grid ---------- */
  main{ padding:6px 18px 26px; }
  main h2{
    font-size:13px; font-weight:700; color:var(--text-dim);
    margin:14px 2px 10px;
  }
  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    text-align:right;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .tile:active{ transform:scale(.97); }
  .tile:hover{ border-color:#3a4048; }
  .tile .tile-icon{ font-size:22px; }
  .tile b{ font-size:13.5px; font-weight:800; }
  .tile small{ font-size:10.5px; color:var(--text-dim); line-height:1.5; }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(6,7,8,.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px;
    max-height:82vh;
    background:var(--bg);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:22px 22px 0 0;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,.9,.32,1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .sheet, .sheet-overlay{ transition:none; }
  }
  .sheet-handle{
    width:36px; height:4px; border-radius:999px;
    background:var(--border);
    margin:10px auto 0;
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px;
    flex-shrink:0;
  }
  .sheet-header h2{ margin:0; font-size:17px; font-weight:800; }
  .sheet-header button{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .sheet-content{
    overflow-y:auto;
    padding:4px 18px 22px;
  }
  .sheet-sub{
    font-size:12px; color:var(--text-dim); line-height:1.6;
    margin:0 0 14px;
  }

  /* ---------- Reusable rows ---------- */
  .row-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 12px;
    margin-bottom:9px;
  }
  .row-icon{
    width:38px; height:38px; flex-shrink:0;
    border-radius:10px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .row-info{ flex:1; min-width:0; }
  .row-info b{ display:block; font-size:13px; font-weight:800; }
  .row-info small{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .row-actions{ display:flex; gap:6px; }

  .btn{
    border:none; cursor:pointer;
    background:var(--accent);
    color:#1a1204;
    font-weight:800; font-size:12.5px;
    padding:9px 14px;
    border-radius:var(--radius-sm);
    white-space:nowrap;
    transition:filter .15s ease, transform .15s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn:hover{ filter:brightness(1.08); }
  .btn-small{ padding:7px 11px; font-size:11.5px; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-block{ display:block; width:100%; text-align:center; margin-top:6px; }
  .btn-danger{ background:var(--danger); color:#fff; }

  .progress-line{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 13px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .progress-line b{ color:var(--text); font-size:14px; }

  .chip-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:11.5px; font-weight:700;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1204;
  }

  .skill-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    margin-bottom:9px;
  }
  .skill-row b{ display:block; font-size:13px; font-weight:800; }
  .skill-row small{ font-size:10.5px; color:var(--text-dim); }

  .result-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    margin-bottom:14px;
  }
  .result-icon{
    width:40px; height:40px; flex-shrink:0;
    border-radius:50%;
    background:rgba(79,168,160,.15);
    color:var(--good);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800;
  }
  .result-card b{ display:block; font-size:14px; }
  .result-card small{ font-size:11px; color:var(--text-dim); }
  .reward-list{ list-style:none; margin:0 0 4px; padding:0; }
  .reward-list li{
    font-size:13px; padding:6px 0;
    border-bottom:1px dashed var(--border);
  }
  .reward-list li:last-child{ border-bottom:none; }
  .reward-list .level-up{ color:var(--accent-strong); font-weight:800; }

  .stat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:9px;
    margin-bottom:16px;
  }
  .stat-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px;
  }
  .stat-box b{ display:block; font-size:12.5px; margin-bottom:3px; }
  .stat-box span{ font-size:18px; font-weight:900; color:var(--accent-strong); }

  .notice{
    font-size:12px; padding:10px 12px;
    border-radius:var(--radius-sm);
    margin-bottom:12px;
  }
  .notice-warn{ background:rgba(193,68,60,.12); color:#e8827b; border:1px solid rgba(193,68,60,.3); }

  /* ---------- Battle screen ---------- */
  .battle-wrap{ padding-bottom:4px; }
  .battle-scene{
    position:relative;
    min-height:238px;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin:4px 0 12px;
    background:
      radial-gradient(circle at 50% 28%, rgba(217,164,65,.10), transparent 34%),
      linear-gradient(180deg, #171a1f 0%, #111316 58%, #0d0f11 100%);
  }
  .battle-scene::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:27px;
    height:48px;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  }
  .battle-arena{
    position:relative;
    min-height:238px;
    display:grid;
    grid-template-columns:1fr 54px 1fr;
    align-items:center;
    gap:6px;
    padding:18px 8px 28px;
  }
  .fighter{
    position:relative;
    z-index:2;
    background:rgba(26,29,34,.88);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px 7px;
    text-align:center;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .fighter.active{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(217,164,65,.12);
    transform:translateY(-3px);
  }
  .fighter.hit-player{ animation:battleAttackPlayer .34s ease; }
  .fighter.hit-enemy{ animation:battleAttackEnemy .34s ease; }
  .fighter.damage{ animation:battleDamage .3s ease; }
  @keyframes battleAttackPlayer{
    0%,100%{ transform:translateX(0); }
    45%{ transform:translateX(14px) scale(1.035); }
  }
  @keyframes battleAttackEnemy{
    0%,100%{ transform:translateX(0); }
    45%{ transform:translateX(-14px) scale(1.035); }
  }
  @keyframes battleDamage{
    0%,100%{ filter:none; }
    35%{ transform:translateX(5px); filter:brightness(1.55); }
  }
  .avatar{
    width:76px;
    height:76px;
    margin:0 auto 8px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(145deg,var(--surface-2),var(--surface));
    border:1px solid var(--border);
  }
  .player-avatar{ position:relative; overflow:visible; }
  .battle-gear{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
    z-index:3;
  }
  .battle-vest{
    right:-5px;
    bottom:3px;
    font-size:23px;
    transform:rotate(7deg);
  }
  .battle-weapon{
    left:-8px;
    top:7px;
    font-size:25px;
    transform:rotate(-18deg);
  }
  .fighter-name{ font-size:12px; font-weight:800; margin-bottom:3px; }
  .fighter-power{ font-size:10.5px; color:var(--text-dim); }
  .hp-track{
    height:7px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
    margin-top:8px;
  }
  .hp-fill{
    height:100%;
    width:100%;
    background:var(--good);
    border-radius:999px;
    transition:width .3s ease;
  }
  .battle-ground{
    position:absolute;
    left:50%;
    bottom:18px;
    width:72%;
    height:2px;
    transform:translateX(-50%);
    background:var(--border);
    box-shadow:0 0 18px rgba(217,164,65,.08);
  }
  .impact{
    position:absolute;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent-strong);
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
    z-index:4;
    pointer-events:none;
  }
  .impact.show{ animation:impactFlash .32s ease; }
  @keyframes impactFlash{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.2); }
    35%{ opacity:1; transform:translate(-50%,-50%) scale(2.8); box-shadow:0 0 24px rgba(240,193,99,.55); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(4.5); }
  }
  .vs{
    position:relative;
    z-index:3;
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
    color:var(--accent-strong);
  }
  .battle-status{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    min-height:22px;
    margin-bottom:9px;
  }
  .battle-log{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:10px 12px;
    max-height:120px;
    overflow:auto;
    margin-bottom:10px;
  }
  .battle-log p{
    margin:0;
    padding:5px 0;
    border-bottom:1px dashed var(--border);
    font-size:11.5px;
    line-height:1.45;
  }
  .battle-log p:last-child{ border-bottom:none; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translate(-50%, 12px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-size:12.5px; font-weight:600;
    padding:10px 18px;
    border-radius:999px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:80;
    max-width:88%;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast-warn{ border-color:rgba(193,68,60,.5); }
  .toast-good{ border-color:rgba(79,168,160,.5); }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">♠</div>
      <div class="brand-text">
        <strong>عصابات الشوارع</strong>
        <span>زعيم المدينة</span>
      </div>
    </div>
    <div class="cash-pill"><span class="cash-icon">💵</span><b id="cash">0</b></div>
  </header>

  <section class="hero">
    <div class="hero-badge"><b id="levelBadge">1</b></div>
    <div class="hero-content">
      <h1 id="cityName">وسط المدينة</h1>
      <p>تدير عصابتك وتبني نفوذك في المدينة، حيّ بعد حيّ.</p>
    </div>
  </section>

  <section class="meters">
    <div>
      <div class="meter-head"><span>⚡ الطاقة</span><span id="energyLabel">0/0</span></div>
      <div class="meter-track"><div class="meter-fill" id="energyFill" style="width:0%"></div></div>
      <small class="meter-note" id="energyNote"></small>
    </div>
    <div class="pill-row">
      <div class="pill-stat"><span>⭐</span><div><b id="respect">0</b><small>احترام</small></div></div>
      <div class="pill-stat"><span>🏆</span><div><b id="done">0</b><small>مهمات</small></div></div>
    </div>
  </section>

  <main>
    <h2>المدينة</h2>
    <div class="menu">
      <button class="tile" data-action="open-missions"><span class="tile-icon">⚔️</span><b>المهمات</b><small>نفّذ المهام واكسب المال والخبرة</small></button>
      <button class="tile" data-action="open-training"><span class="tile-icon">🏋️</span><b>التدريب</b><small>طوّر مهارات شخصيتك</small></button>
      <button class="tile" data-action="open-market"><span class="tile-icon">🛒</span><b>التسوق</b><small>اشترِ معدات جديدة</small></button>
      <button class="tile" data-action="open-trade"><span class="tile-icon">📦</span><b>التجارة</b><small>اشترِ وبِع لتحقيق الأرباح</small></button>
      <button class="tile" data-action="open-base"><span class="tile-icon">🏢</span><b>المقر</b><small>تابع مستوى عصابتك</small></button>
      <button class="tile" data-action="open-profile"><span class="tile-icon">👤</span><b>ملفي</b><small>الإحصاءات والقدرات</small></button>
    </div>
  </main>

  <div id="screen" class="sheet-overlay">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="sheetTitle"></h2>
        <button id="closeSheet" aria-label="إغلاق">×</button>
      </div>
      <div id="content" class="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "street-gangs-save-v5";
  var ENERGY_REGEN_MS = 3 * 60 * 1000; // 1 energy point every 3 minutes

  var CONFIG = {
    cities: [
      { id:"downtown",   name:"وسط المدينة",     mult:1.00 },

    ]
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  }); }

  function xpNeeded(level){ return level * 100; }
  function energyMaxFor(level){ return 100 + (level - 1) * 10; }

  function defaultState(){
    return {
      cash: 1000,
      energy: 100,
      energyMax: 100,
      respect: 10,
      level: 1,
      xp: 0,
      done: 0,
      stamina: 4,
      cityId: "downtown",
      stats: { power:5, defense:5, speed:5, accuracy:5 },
      inv: {},
      lastEnergyTs: Date.now()
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        var merged = Object.assign(defaultState(), parsed);
        merged.stats = Object.assign(defaultState().stats, parsed.stats || {});
        merged.energyMax = Math.max(merged.energyMax, energyMaxFor(merged.level));
        merged.energy = Math.min(merged.energy, merged.energyMax);
        return merged;
      }
    }catch(e){ /* storage unavailable — fall back to defaults */ }
    return defaultState();
  }

  var state = loadState();
  var storageOK = true;

  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ storageOK = false; }
  }

  function commit(){ persist(); renderAll(); }

  // ---------- rendering ----------
  function renderHeader(){
    $("cash").textContent = state.cash.toLocaleString("ar-EG");
    $("levelBadge").textContent = state.level;
    var city = CONFIG.cities.find(function(c){ return c.id === state.cityId; });
    $("cityName").textContent = city ? city.name : "وسط المدينة";
    $("respect").textContent = state.respect;
    $("done").textContent = state.done;
  }

  function renderEnergy(){
    var pct = Math.max(0, Math.min(100, (state.energy / state.energyMax) * 100));
    $("energyFill").style.width = pct + "%";
    $("energyLabel").textContent = state.energy + "/" + state.energyMax;
    var note = $("energyNote");
    if(state.energy >= state.energyMax){
      note.textContent = "الطاقة ممتلئة";
    } else {
      var elapsed = Date.now() - state.lastEnergyTs;
      var remain = ENERGY_REGEN_MS - (elapsed % ENERGY_REGEN_MS);
      var mm = Math.floor(remain / 60000);
      var ss = Math.floor((remain % 60000) / 1000);
      note.textContent = "نقطة طاقة جديدة خلال " + mm + ":" + (ss < 10 ? "0" : "") + ss;
    }
  }

  function renderAll(){ renderHeader(); renderEnergy(); }

  function energyTick(){
    var now = Date.now();
    var elapsed = now - state.lastEnergyTs;
    var gained = Math.floor(elapsed / ENERGY_REGEN_MS);
    if(gained > 0){
      if(state.energy < state.energyMax){
        var add = Math.min(gained, state.energyMax - state.energy);
        state.energy += add;
      }
      state.lastEnergyTs += gained * ENERGY_REGEN_MS;
      persist();
    }
    renderEnergy();
  }

  // ---------- sheet ----------
  var sheetOpen = false;
  function openSheet(title, html){
    $("sheetTitle").textContent = title;
    $("content").innerHTML = html;
    $("content").scrollTop = 0;
    if(!sheetOpen){
      $("screen").classList.add("open");
      document.body.style.overflow = "hidden";
      sheetOpen = true;
    }
  }
  function closeSheet(){
    $("screen").classList.remove("open");
    document.body.style.overflow = "";
    sheetOpen = false;
  }

  var toastTimer = null;
  function toast(msg, kind){
    var el = $("toast");
    el.textContent = msg;
    el.className = "toast show" + (kind ? " toast-" + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  function spendEnergy(cost){
    if(state.energy < cost){
      toast("لا توجد طاقة كافية", "warn");
      return false;
    }
    state.energy -= cost;
    return true;
  }

  function addXP(amount){
    var leveled = false;
    state.xp += amount;
    while(state.xp >= xpNeeded(state.level)){
      state.xp -= xpNeeded(state.level);
      state.level += 1;
      state.energyMax = energyMaxFor(state.level);
      state.energy = state.energyMax;
      leveled = true;
    }
    return leveled;
  }

  function missionHTML(){
    var xpNext = xpNeeded(state.level);
    var html = '<p class="sheet-sub">اختر مهمة. قبل المكافأة ستدخل مواجهة متدرجة مع صاحب المهمة.</p>';
    html += '<div class="progress-line"><span>خبرة المستوى</span><b>' + state.xp + ' / ' + xpNext + '</b></div>';
    CONFIG.missions.forEach(function(m){
      var locked = state.level < m.level;
      html += '<div class="row-card">';
      html += '<div class="row-icon">' + m.icon + '</div>';
      html += '<div class="row-info"><b>' + esc(m.name) + '</b><small>مستوى ' + m.level + ' • قوة الخصم ' + m.enemyPower + ' جين • ⚡ ' + m.energy + ' • 💵 ' + m.cash + ' • XP ' + m.xp + '</small></div>';
      html += '<button class="btn btn-small ' + (locked ? 'btn-ghost' : '') + '" data-do="mission" data-id="' + m.id + '"' + (locked ? ' disabled' : '') + '>' + (locked ? 'مغلق' : 'ابدأ') + '</button>';
      html += '</div>';
    });
    return html;
  }

  function trainingHTML(){
    var html = '<p class="sheet-sub">درّب مهارة واحدة مقابل الطاقة. كل تدريب يرفع المهارة نقطة واحدة.</p>';
    CONFIG.skills.forEach(function(s){
      html += '<div class="skill-row"><div><b>' + s.icon + ' ' + s.name + '</b><small>المستوى الحالي: ' + state.stats[s.key] + '</small></div>';
      html += '<button class="btn btn-small" data-do="train" data-id="' + s.key + '">تدريب • ⚡ 10</button></div>';
    });
    return html;
  }

  function marketHTML(){
    var html = '<p class="sheet-sub">معدات دائمة. شراء القطعة يرفع إحدى مهاراتك مباشرة.</p>';
    CONFIG.market.forEach(function(item){
      html += '<div class="row-card"><div class="row-icon">' + item.icon + '</div>';
      html += '<div class="row-info"><b>' + item.name + '</b><small>' + item.desc + ' • 💵 ' + item.price + '</small></div>';
      html += '<button class="btn btn-small" data-do="buy-market" data-id="' + item.id + '">شراء</button></div>';
    });
    return html;
  }

  function tradeHTML(){
    var city = CONFIG.cities.find(function(c){ return c.id === state.cityId; }) || CONFIG.cities[0];
    var html = '<p class="sheet-sub">المدينة الحالية: <b>' + city.name + '</b>. الأسعار تتغير حسب المدينة.</p>';
    html += '<div class="chip-row">';
    CONFIG.cities.forEach(function(c){
      html += '<button class="chip ' + (c.id === state.cityId ? 'chip-active' : '') + '" data-do="city" data-id="' + c.id + '">' + c.name + '</button>';
    });
    html += '</div>';
    CONFIG.goods.forEach(function(g){
      var buy = Math.round(g.base * city.mult);
      var sell = Math.round(buy * 0.72);
      var qty = state.inv[g.id] || 0;
      html += '<div class="row-card"><div class="row-icon">' + g.icon + '</div>';
      html += '<div class="row-info"><b>' + g.name + '</b><small>شراء ' + buy + ' • بيع ' + sell + ' • معك: ' + qty + '</small></div>';
      html += '<div class="row-actions"><button class="btn btn-small" data-do="buy-good" data-id="' + g.id + '">+</button>';
      html += '<button class="btn btn-small btn-ghost" data-do="sell-good" data-id="' + g.id + '">−</button></div></div>';
    });
    return html;
  }

  function baseHTML(){
    var totalStats = state.stats.power + state.stats.defense + state.stats.speed + state.stats.accuracy;
    return '<p class="sheet-sub">المقر هو مركز عصابتك. كلما ارتفع مستواك زادت طاقتك القصوى.</p>' +
      '<div class="stat-grid"><div class="stat-box"><b>المستوى</b><span>' + state.level + '</span></div>' +
      '<div class="stat-box"><b>الاحترام</b><span>' + state.respect + '</span></div>' +
      '<div class="stat-box"><b>إجمالي المهارات</b><span>' + totalStats + '</span></div>' +
      '<div class="stat-box"><b>المهمات المكتملة</b><span>' + state.done + '</span></div></div>' +
      '<button class="btn btn-block" data-do="rest">استعادة الطاقة</button>';
  }

  function profileHTML(){
    var html = '<p class="sheet-sub">إحصاءات شخصيتك الحالية.</p>';
    CONFIG.skills.forEach(function(s){
      html += '<div class="skill-row"><div><b>' + s.icon + ' ' + s.name + '</b><small>النقاط المكتسبة</small></div><strong>' + state.stats[s.key] + '</strong></div>';
    });
    html += '<div class="stat-grid"><div class="stat-box"><b>المال</b><span>' + state.cash.toLocaleString("ar-EG") + '</span></div>' +
      '<div class="stat-box"><b>الخبرة</b><span>' + state.xp + '</span></div></div>';
    return html;
  }

  function openAction(action){
    if(action === "open-missions") openSheet("المهمات", missionHTML());
    else if(action === "open-training") openSheet("التدريب", trainingHTML());
    else if(action === "open-market") openSheet("التسوق", marketHTML());
    else if(action === "open-trade") openSheet("التجارة", tradeHTML());
    else if(action === "open-base") openSheet("المقر", baseHTML());
    else if(action === "open-profile") openSheet("ملفي", profileHTML());
  }

  function playerBattlePower(){
    return Math.max(1, Math.round(
      state.stats.power +
      state.stats.defense * 0.35 +
      state.stats.speed * 0.35 +
      state.stats.accuracy * 0.45
    ));
  }

  var battleTimer = null;

  function battleHTML(m, playerHP, enemyHP, log, turn, status){
    var playerMax = 100;
    var enemyMax = 100;
    var playerPct = Math.max(0, Math.min(100, playerHP));
    var enemyPct = Math.max(0, Math.min(100, enemyHP));
    var playerActive = turn === "player" ? " active" : "";
    var enemyActive = turn === "enemy" ? " active" : "";
    var html = '<div class="battle-wrap">';
    html += '<p class="sheet-sub">المواجهة تلقائية: تهاجم أنت أولاً، ثم يرد صاحب المهمة، وتستمر الجولة حتى يفوز أحدكما.</p>';
    html += '<div class="battle-scene"><div class="battle-arena">';
    html += '<div id="fighterPlayer" class="fighter' + playerActive + '"><div class="avatar player-avatar"><span class="avatar-base">👤</span>' + (state.inv.vest ? '<span class="battle-gear battle-vest">🦺</span>' : '') + (state.inv.gear ? '<span class="battle-gear battle-weapon">⚔️</span>' : '') + '</div><div class="fighter-name">أنت</div><div class="fighter-power">القوة القتالية: ' + playerBattlePower() + ' جين</div><div class="hp-track"><div id="playerHP" class="hp-fill" style="width:' + playerPct + '%"></div></div></div>';
    html += '<div class="vs">VS</div>';
    html += '<div id="fighterEnemy" class="fighter' + enemyActive + '"><div class="avatar">🥷</div><div class="fighter-name">' + esc(m.name) + '</div><div class="fighter-power">قوة الخصم: ' + m.enemyPower + ' جين</div><div class="hp-track"><div id="enemyHP" class="hp-fill" style="width:' + enemyPct + '%"></div></div></div>';
    html += '</div><div class="battle-ground"></div><div id="battleImpact" class="impact"></div></div>';
    html += '<div id="battleStatus" class="battle-status">' + esc(status) + '</div>';
    html += '<div id="battleLog" class="battle-log">';
    log.forEach(function(line){ html += '<p>' + esc(line) + '</p>'; });
    html += '</div>';
    return html + '</div>';
  }

  function updateBattleUI(playerHP, enemyHP, turn, line, status, attacker){
    var p = $("playerHP");
    var e = $("enemyHP");
    var log = $("battleLog");
    if(p) p.style.width = Math.max(0, playerHP) + "%";
    if(e) e.style.width = Math.max(0, enemyHP) + "%";
    var pf = $("fighterPlayer");
    var ef = $("fighterEnemy");
    if(pf) pf.classList.toggle("active", turn === "player");
    if(ef) ef.classList.toggle("active", turn === "enemy");

    [pf, ef].forEach(function(el){
      if(el) el.classList.remove("hit-player","hit-enemy","damage");
    });
    var attackerEl = attacker === "player" ? pf : ef;
    var targetEl = attacker === "player" ? ef : pf;
    if(attackerEl){
      void attackerEl.offsetWidth;
      attackerEl.classList.add(attacker === "player" ? "hit-player" : "hit-enemy");
    }
    if(targetEl){
      setTimeout(function(){
        targetEl.classList.remove("damage");
        void targetEl.offsetWidth;
        targetEl.classList.add("damage");
      }, 180);
    }
    var impact = $("battleImpact");
    if(impact){
      impact.classList.remove("show");
      void impact.offsetWidth;
      impact.classList.add("show");
    }
    if(line && log){
      var item = document.createElement("p");
      item.textContent = line;
      log.appendChild(item);
      log.scrollTop = log.scrollHeight;
    }
    if($("battleStatus")) $("battleStatus").textContent = status;
  }

  function finishMissionBattle(m, won, playerHP, enemyHP){
    clearInterval(battleTimer);
    battleTimer = null;
    if(won){
      state.cash += m.cash;
      state.done += 1;
      var respectGain = Math.max(1, Math.ceil(m.xp / 20));
      state.respect += respectGain;
      var levelUp = addXP(m.xp);
      commit();
      openSheet("نتيجة المعركة", '<div class="result-card"><div class="result-icon">✓</div><div><b>فزت بالمواجهة</b><small>هزمت صاحب المهمة وكملت المهمة.</small></div></div>' +
        '<ul class="reward-list"><li>💵 +' + m.cash + '</li><li>⭐ احترام +' + respectGain + '</li><li>✨ XP +' + m.xp + '</li>' +
        (levelUp ? '<li class="level-up">🎉 ارتقيت إلى المستوى ' + state.level + '</li>' : '') + '</ul>' +
        '<button class="btn btn-block" data-do="back-missions">العودة إلى المهمات</button>');
      toast(levelUp ? "فوز! وترقيت في المستوى" : "فوز! حصلت على المكافآت", "good");
    }else{
      var loss = Math.min(state.energy, 10);
      state.energy -= loss;
      commit();
      openSheet("نتيجة المعركة", '<div class="result-card"><div class="result-icon" style="background:rgba(193,68,60,.15);color:#e8827b">×</div><div><b>خسرت المواجهة</b><small>لم تكتمل المهمة هذه المرة.</small></div></div>' +
        '<ul class="reward-list"><li>⚡ -' + loss + ' طاقة</li><li>💵 لا توجد مكافأة</li><li>✨ لا توجد خبرة</li></ul>' +
        '<button class="btn btn-block" data-do="back-missions">العودة إلى المهمات</button>');
      toast("خسرت المواجهة وفقدت " + loss + " طاقة", "warn");
    }
  }

  function startMissionBattle(m){
    clearInterval(battleTimer);
    var playerPower = playerBattlePower();
    var enemyPower = m.enemyPower;
    var playerHP = 100;
    var enemyHP = 100;
    var turn = "player";
    var log = ["بدأت المواجهة. أنت تهاجم أولاً."];
    openSheet("المواجهة", battleHTML(m, playerHP, enemyHP, log, turn, "دورك الآن"));

    battleTimer = setInterval(function(){
      if(!sheetOpen){
        clearInterval(battleTimer);
        battleTimer = null;
        return;
      }

      if(turn === "player"){
        var accuracyBonus = state.stats.accuracy * 0.12;
        var damage = Math.max(5, Math.round(playerPower * (0.72 + Math.random() * 0.38) + accuracyBonus));
        enemyHP = Math.max(0, enemyHP - damage);
        updateBattleUI(playerHP, enemyHP, "enemy", "أنت هاجمت وألحقت " + damage + " ضرر.", "هجومك تم — دور الخصم", "player");
        if(enemyHP <= 0){
          finishMissionBattle(m, true, playerHP, enemyHP);
          return;
        }
        turn = "enemy";
      }else{
        var enemyDamage = Math.max(3, Math.round(enemyPower * (0.50 + Math.random() * 0.28) - state.stats.defense * 0.16));
        playerHP = Math.max(0, playerHP - enemyDamage);
        updateBattleUI(playerHP, enemyHP, "player", "صاحب المهمة هاجم وألحق " + enemyDamage + " ضرر.", "دورك الآن", "enemy");
        if(playerHP <= 0){
          finishMissionBattle(m, false, playerHP, enemyHP);
          return;
        }
        turn = "player";
      }
    }, 850);
  }

  function runMission(id){
    var m = CONFIG.missions.find(function(x){ return x.id === id; });
    if(!m) return;
    if(state.level < m.level){
      toast("هذه المهمة تفتح عند المستوى " + m.level, "warn");
      return;
    }
    if(!spendEnergy(m.energy)) return;
    persist();
    startMissionBattle(m);
  }

  function trainSkill(key){
    var s = CONFIG.skills.find(function(x){ return x.key === key; });
    if(!s) return;
    if(!spendEnergy(10)) return;
    state.stats[key] += 1;
    state.respect += 1;
    commit();
    openSheet("التدريب", trainingHTML());
    toast("تم تطوير " + s.name + " +1", "good");
  }

  function buyMarket(id){
    var item = CONFIG.market.find(function(x){ return x.id === id; });
    if(!item) return;
    if(state.cash < item.price){ toast("المال غير كافٍ", "warn"); return; }
    state.cash -= item.price;
    state.stats[item.stat] += item.amount;
    state.inv[item.id] = (state.inv[item.id] || 0) + 1;
    commit();
    openSheet("التسوق", marketHTML());
    toast("تم شراء " + item.name, "good");
  }

  function buyGood(id){
    var city = CONFIG.cities.find(function(c){ return c.id === state.cityId; }) || CONFIG.cities[0];
    var g = CONFIG.goods.find(function(x){ return x.id === id; });
    if(!g) return;
    var price = Math.round(g.base * city.mult);
    if(state.cash < price){ toast("المال غير كافٍ", "warn"); return; }
    state.cash -= price;
    state.inv[g.id] = (state.inv[g.id] || 0) + 1;
    commit();
    openSheet("التجارة", tradeHTML());
    toast("تم شراء " + g.name, "good");
  }

  function sellGood(id){
    var city = CONFIG.cities.find(function(c){ return c.id === state.cityId; }) || CONFIG.cities[0];
    var g = CONFIG.goods.find(function(x){ return x.id === id; });
    if(!g) return;
    var qty = state.inv[g.id] || 0;
    if(qty <= 0){ toast("لا تملك هذه السلعة", "warn"); return; }
    var sell = Math.round(g.base * city.mult * 0.72);
    state.inv[g.id] = qty - 1;
    state.cash += sell;
    commit();
    openSheet("التجارة", tradeHTML());
    toast("تم بيع " + g.name, "good");
  }

  function changeCity(id){
    if(!CONFIG.cities.some(function(c){ return c.id === id; })) return;
    state.cityId = id;
    persist();
    openSheet("التجارة", tradeHTML());
    renderAll();
    toast("انتقلت إلى " + (CONFIG.cities.find(function(c){ return c.id === id; }) || CONFIG.cities[0]).name, "good");
  }

  function rest(){
    var missing = state.energyMax - state.energy;
    if(missing <= 0){ toast("طاقتك ممتلئة"); return; }
    state.energy = state.energyMax;
    state.lastEnergyTs = Date.now();
    commit();
    openSheet("المقر", baseHTML());
    toast("تم استعادة الطاقة", "good");
  }

  document.addEventListener("click", function(e){
    var tile = e.target.closest("[data-action]");
    if(tile){ openAction(tile.getAttribute("data-action")); return; }

    var action = e.target.closest("[data-do]");
    if(!action) return;
    var type = action.getAttribute("data-do");
    var id = action.getAttribute("data-id");

    if(type === "mission") runMission(id);
    else if(type === "train") trainSkill(id);
    else if(type === "buy-market") buyMarket(id);
    else if(type === "buy-good") buyGood(id);
    else if(type === "sell-good") sellGood(id);
    else if(type === "city") changeCity(id);
    else if(type === "rest") rest();
    else if(type === "back-missions") openSheet("المهمات", missionHTML());
  });

  $("closeSheet").addEventListener("click", closeSheet);
  $("screen").addEventListener("click", function(e){
    if(e.target === $("screen")) closeSheet();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && sheetOpen) closeSheet();
  });

  setInterval(energyTick, 1000);
  renderAll();
  persist();
})(); 
</script>
</body>
</html>
