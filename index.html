<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>عصابات الشوارع — مدينة ثلاثية الأبعاد</title><link rel="stylesheet" href="style.css"></head>
<body><div class="game">
<header><div class="avatar">♟</div><div class="brand"><b>زعيم الشوارع</b><small>المستوى <strong id="level">1</strong></small></div><div class="res"><span>💵 <b id="cash">1000</b></span><span>⚡ <b id="energy">100</b></span><span>🪙 <b id="respect">10</b></span></div><button id="reset">↻</button></header>
<section class="xp"><div><b>المستوى <span id="level2">1</span></b><span id="xpText">0 / 100 XP</span></div><i><em id="xpFill"></em></i><small>نقاط التحمل: <b id="stamina">0</b></small></section>
<main id="cityStage"><canvas id="city3d"></canvas><div class="city-ui"><div class="city-title"><small>عالم عصابات الشوارع</small><h1>وسط المدينة</h1><span>مدينة ثلاثية الأبعاد — اسحب للتحرك، قرّب وابتعد، واضغط على المباني</span></div><div class="city-help"><b>◈ استكشف المدينة</b><small>سحب • دوران • تكبير</small></div><div id="buildingHint" class="building-hint">اقترب من مبنى لاكتشافه</div></div></main>
<section class="feed"><b>آخر الأحداث</b><div id="log"></div></section>
<nav><button data-a="home">⌂<small>المدينة</small></button><button data-a="missions">⚔<small>المهمات</small></button><button data-a="training">🏋<small>التدريب</small></button><button data-a="market">🛒<small>التسوق</small></button><button data-a="trade">📦<small>التجارة</small></button></nav></div>
<div id="screen"><div class="panel"><button id="close">×</button><div id="content"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="scene.js"></script><script src="game.js"></script></body></html>
