name: Validate game files\non:\n  push:\n    branches: [main]\npermissions:\n  contents: read\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Validate JavaScript\n        run: node --check game-enhancer.js && node --check game-enhancer-ui.js\n      - name: Check script loading\n        run: python - <<'PY'\nfrom pathlib import Path\ns=Path('index.html').read_text(encoding='utf-8')\nassert s.count('src="game-enhancer.js"')==1\nassert s.count('src="game-enhancer-ui.js"')==1\nprint('script loading OK')\nPY\n