name: Activate game enhancer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='<script src="game-enhancer.js"></script>'
          if marker not in s:
              s=s.replace("</body>", marker+'<script src="game-enhancer-ui.js"></script></body>')
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "تفعيل أنظمة اللعبة الجديدة" && git push)
