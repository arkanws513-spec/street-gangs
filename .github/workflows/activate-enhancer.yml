name: Validate game
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline game scripts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const scripts=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]);
          if(scripts.length<2) throw new Error('Expected inline game scripts');
          for(let i=0;i<scripts.length;i++) new Function(scripts[i]);
          if((h.match(/game-enhancer\\.js/gi)||[]).length) throw new Error('External game-enhancer.js reference remains');
          if((h.match(/game-enhancer-ui\\.js/gi)||[]).length) throw new Error('External game-enhancer-ui.js reference remains');
          console.log('Inline scripts OK');
          NODE
