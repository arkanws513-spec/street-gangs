name: Build Unity WebGL

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-webgl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-project/Library
          key: UnityLibrary-WebGL-${{ hashFiles('unity-project/Assets/**', 'unity-project/Packages/**', 'unity-project/ProjectSettings/**') }}
          restore-keys: |
            UnityLibrary-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-project
          unityVersion: auto
          targetPlatform: WebGL
          buildName: StreetGangs
          buildsPath: build

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: StreetGangs-WebGL
          path: build/WebGL
          if-no-files-found: error
